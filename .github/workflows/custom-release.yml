name: Build and publish custom Forge

on:
  push:
    tags:
      - "custom-v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build desktop installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build Forge installer
        env:
          _JAVA_OPTIONS: -Xmx2g
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99

          mvn -U -B clean \
            -P windows-linux \
            install \
            -DskipTests \
            -Dskip.flatten=true \
            -T 1C

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#custom-v}"

          INSTALLER="$(find forge-installer/target \
            -maxdepth 1 \
            -type f \
            -name 'forge-installer-*.jar' \
            -print -quit)"

          PORTABLE="$(find forge-installer/target \
            -maxdepth 1 \
            -type f \
            -name 'forge-installer-*.tar.bz2' \
            -print -quit)"

          if [[ -z "${INSTALLER}" || ! -f "${INSTALLER}" ]]; then
            echo "Forge installer was not produced."
            exit 1
          fi

          if [[ -z "${PORTABLE}" || ! -f "${PORTABLE}" ]]; then
            echo "Portable Forge archive was not produced."
            exit 1
          fi

          mkdir -p release

          cp "${INSTALLER}" \
            "release/Forge-Custom-${VERSION}-installer.jar"

          cp "${PORTABLE}" \
            "release/Forge-Custom-${VERSION}-portable.tar.bz2"

          (
            cd release
            sha256sum \
              "Forge-Custom-${VERSION}-installer.jar" \
              "Forge-Custom-${VERSION}-portable.tar.bz2" \
              > SHA256SUMS.txt
          )

          echo "Release files:"
          ls -lh release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#custom-v}"

          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --verify-tag \
            --title "Forge Custom ${VERSION}" \
            --generate-notes